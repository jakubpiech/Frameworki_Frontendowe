<section class="list">
  <div class="filterSection">
    <form #filterForm>
      <label for="nameFilter">Znajdź restaurację po nazwie: </label>
      <input
        #nameInput
        type="text"
        id="nameFilter"
        placeholder="Wpisz nazwę restauracji..."
        (input)="onNameChange(nameInput.value)"
      />

      <label for="cuisineFilter"> Wybierz kuchnię: </label>
      <select #cuisineInput id="cuisineFilter" (change)="onCuisineChange(cuisineInput.value)">
        <option value="all">Wszystkie</option>
        <option value="italian">Włoska</option>
        <option value="polish">Polska</option>
        <option value="chinese">Chińska</option>
        <option value="thai">Tajska</option>
        <option value="american">Amerykańska</option>
      </select>

      <label for="statusFilter"> Filtruj po statusie: </label>
      <select #statusInput id="statusFilter" (change)="onStatusChange(statusInput.value)">
        <option value="all">Wszystkie</option>
        <option value="open">Otwarte</option>
        <option value="closed">Zamknięte</option>
      </select>

      <label for="sortFilter"> Sortuj po: </label>
      <select #sortInput id="sortFilter" (change)="onSortChange(sortInput.value)">
        <option value="rating">Rating</option>
        <option value="deliveryTime">Czas Dostawy</option>
        <option value="deliveryCost">Koszt dostawy</option>
      </select>
      <button type="button" (click)="filterForm.reset(); resetFilters()">Reset Filtrów</button>
    </form>
  </div>

  @for (restaurant of displayedRestaurants(); track restaurant.id) {
    <app-restaurant-card [restaurant]="restaurant" />
  }
</section>
