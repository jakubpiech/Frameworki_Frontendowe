<table>
  <thead>
    <tr>
      <th>Restauracja</th>
      <th>Kwota do Zapłaty</th>
      <th>Status</th>
      <th>Szczegóły</th>
    </tr>
  </thead>
  <tbody>
    @for (order of orders(); track order.id) {
      <tr routerLinkActive="selected" ariaCurrentWhenActive="page">
        <td>{{ order.restaurantName }}</td>
        <td>{{ order.totalToPay | number: '1.2-2' }}zł</td>
        <td>
          <span
            class="status"
            [class.delivered]="order.status === 'delivered'"
            [class.cancelled]="order.status === 'cancelled'"
            >{{ statusLabels[order.status] }}</span
          >
        </td>
        <td><a class="btn" [routerLink]="['/orders', order.id]">Szczegóły</a></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Brak zamówień</td>
      </tr>
    }
  </tbody>
</table>
<router-outlet></router-outlet>
