<label for="statusFilter">Status</label>
<select id="statusFilter" #statusSelect (change)="onStatusChange(statusSelect.value)">
  <option value="all">Wszystkie</option>
  @for (status of statuses; track status) {
    <option [value]="status">{{ statusLabels[status] }}</option>
  }
</select>

<table>
  <thead>
    <tr>
      <th>Restauracja</th>
      <th>Klient</th>
      <th>Kwota do zapłaty</th>
      <th>Status</th>
      <th>Szczegóły</th>
    </tr>
  </thead>
  <tbody>
    @for (order of filteredOrders(); track order.id) {
      <tr>
        <td>{{ order.restaurantName }}</td>
        <td>{{ order.userName }} {{ order.userSurname }}</td>
        <td>{{ order.totalToPay | number: '1.2-2' }}zł</td>
        <td>{{ statusLabels[order.status] }}</td>
        <td><a [routerLink]="['/admin/orders', order.id]">Szczegóły</a></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Brak zamówień</td>
      </tr>
    }
  </tbody>
</table>
